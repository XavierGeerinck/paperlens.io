name: Paper radar

# Ranks the week's research against the catalogue and posts the shortlist.
# Writes no content and opens no PR — the output is a decision, not a page.
on:
  schedule:
    # Mondays 06:00 UTC, after the weekend's arXiv listings have settled
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan"
        required: false
        default: "7"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Rank this week's papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ vars.OPENAI_API_URL }}
          PAPERLENS_MODEL: ${{ vars.PAPERLENS_MODEL }}
        run: bun scripts/radar.ts --days "${{ inputs.days || '7' }}" --out radar.md --title-out radar-title.txt

      - name: Open the week's radar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE=$(cat radar-title.txt)
          echo "Title: $TITLE"

          # A label makes the whole series findable even as titles vary.
          gh label create radar --color 0E8A16 --description "Weekly paper scan" 2>/dev/null || true

          # Re-running in the same week updates that week's issue rather than
          # opening a second one. The ISO week prefix is the identity.
          WEEK=$(printf '%s' "$TITLE" | grep -oE '[0-9]{4}-W[0-9]{2}' | head -1)
          NUM=$(gh issue list --state open --label radar --limit 50 \
                  --json number,title --jq \
                  "[.[] | select(.title | contains(\"$WEEK\"))][0].number // empty")

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE"
            gh issue comment "$NUM" --body-file radar.md
            echo "updated issue #$NUM"
          else
            URL=$(gh issue create --title "$TITLE" --label radar --body-file radar.md)
            echo "opened $URL"
          fi
