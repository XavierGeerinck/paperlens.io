name: Paper radar

# Ranks the week's research against the catalogue and posts the shortlist.
# Writes no content and opens no PR — the output is a decision, not a page.
on:
  schedule:
    # Mondays 06:00 UTC, after the weekend's arXiv listings have settled
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan"
        required: false
        default: "7"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Rank this week's papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ vars.OPENAI_API_URL }}
          PAPERLENS_MODEL: ${{ vars.PAPERLENS_MODEL }}
        run: bun scripts/radar.ts --days "${{ inputs.days || '7' }}" --out radar.md

      - name: Post to the radar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --search "Paper radar in:title" \
                  --json number,title --jq '[.[] | select(.title == "Paper radar")][0].number // empty')

          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "Paper radar" \
              --body $'Running log of the weekly paper scan.\n\nEach comment is one week: what was scanned, what scored well, and what was dropped as already covered.\n\nReply `/build <arxiv-id>` on this issue to publish one.' \
              --json number --jq .number 2>/dev/null \
              || gh issue create --title "Paper radar" --body "Running log of the weekly paper scan. Reply \`/build <arxiv-id>\` to publish one." | grep -oE '[0-9]+$')
            echo "created issue #$NUM"
          fi

          gh issue comment "$NUM" --body-file radar.md
          echo "posted to issue #$NUM"
