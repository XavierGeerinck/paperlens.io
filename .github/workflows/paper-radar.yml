name: Paper radar

# Ranks the week's research against the catalogue and posts the shortlist.
# Writes no content and opens no PR — the output is a decision, not a page.
on:
  schedule:
    # Mondays 06:00 UTC, after the weekend's arXiv listings have settled
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to scan, e.g. 2026-W35 (defaults to last week)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rank this week's papers
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_WEEK: ${{ inputs.week }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowed-tools "Bash,Read,Glob,Grep,WebFetch,WebSearch"
          prompt: |
            Run the /scan-papers command in --shortlist mode for the week
            $SCAN_WEEK (use the previous ISO week if that is empty).

            Stop at the ranked shortlist. Write no content files, create no
            branch, open no pull request.

            Then publish the result to the radar issue:

            1. Find the open issue titled "Paper radar" with
               `gh issue list --state open --search "Paper radar in:title" --json number,title`.
            2. If none exists, create it with `gh issue create`, titled
               "Paper radar", body explaining that this issue is the running log
               of weekly scans and that replying `@claude build <arxiv-id>` on it
               publishes that paper.
            3. Comment on it with `gh issue comment` containing:
               - a heading with the ISO week and date range
               - the ranked shortlist table, search demand doubled as the rubric says
               - the recommended pick, the query it would target, and what
                 currently ranks for that query
               - a short "already covered" list naming which existing entry
                 covered each rejected paper
               - a closing line: "Reply `@claude build <arxiv-id>` to publish one."

            Keep the comment under 400 words of prose. The table carries the detail.
