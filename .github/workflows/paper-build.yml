name: Paper build

# Publishes one paper as an entry + simulation, on request.
# Triggered by `/build <arxiv-id>` from someone who can write to the repo, or
# dispatched by the Paper radar for its pick of the day.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      arxiv:
        description: "arXiv ID to publish"
        required: true
        type: string
      issue:
        description: "Issue to report back on"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  # starting the Pages deploy after an automatic merge
  actions: write

concurrency:
  group: paper-build-${{ github.event.issue.number || inputs.issue || inputs.arxiv }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/build') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      # Empty for a dispatch that names no issue; the steps that comment skip then.
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Parse the request
        id: req
        env:
          BODY: ${{ github.event.comment.body || inputs.arxiv }}
        run: |
          set -euo pipefail
          ID=$(printf '%s' "$BODY" | grep -oE '[0-9]{4}\.[0-9]{4,5}' | head -1 || true)
          if [ -z "$ID" ]; then
            echo "No arXiv ID found in the comment." >&2
            exit 1
          fi
          echo "arxiv=$ID" >> "$GITHUB_OUTPUT"
          echo "Building $ID"

      - name: Acknowledge
        if: env.ISSUE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The radar reads these comments to learn what has been tried, so the
        # leading "Building `<id>`" is a format it depends on.
        run: |
          gh issue comment "$ISSUE" \
            --repo ${{ github.repository }} \
            --body "Building \`${{ steps.req.outputs.arxiv }}\` — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install chromium
        # Plain install first: it only downloads the browser, while --with-deps
        # runs apt-get update, which fails whenever any third-party repo on the
        # runner image is unhappy (a 403 from packages.microsoft.com broke a run).
        # The ubuntu runner already ships the shared libraries chromium needs.
        run: |
          bunx playwright install chromium || {
            echo "plain install failed; retrying with system dependencies"
            bunx playwright install --with-deps chromium
          }

      - name: Write the entry
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ vars.OPENAI_API_URL }}
          PAPERLENS_MODEL: ${{ vars.PAPERLENS_MODEL }}
        run: |
          set -euo pipefail
          bun scripts/build-entry.ts "${{ steps.req.outputs.arxiv }}" --retries 3 | tee result.json
          echo "slug=$(jq -r .slug result.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title result.json)" >> "$GITHUB_OUTPUT"
          echo "entry=$(jq -r .entryPath result.json)" >> "$GITHUB_OUTPUT"
          echo "sim=$(jq -r .simPath result.json)" >> "$GITHUB_OUTPUT"
          echo "claims=$(jq -r '.unsupportedNumbers | join(", ")' result.json)" >> "$GITHUB_OUTPUT"

      - name: Verify it renders
        run: bun scripts/verify-page.ts "/idea/${{ steps.gen.outputs.slug }}/"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment rather than pasted into the script: a title
          # with a quote, a backtick or a dollar sign would be read as shell.
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
          ENTRY: ${{ steps.gen.outputs.entry }}
          SIM: ${{ steps.gen.outputs.sim }}
          ARXIV: ${{ steps.req.outputs.arxiv }}
        run: |
          set -euo pipefail
          BRANCH="paper/$SLUG"
          git config user.name "paperlens-bot"
          git config user.email "noreply@paperlens.io"
          git checkout -b "$BRANCH"

          # Only the generated entry, its simulation, and any reverse links.
          git add "$ENTRY" "$SIM"
          git add src/content/ideas
          git commit -m "feat(paper): $TITLE

          Covers arXiv:$ARXIV. Generated by the Paper build workflow${ISSUE:+ for
          issue #$ISSUE}, build verified and rendered in a headless browser
          before this PR was opened."

          git push -u origin "$BRANCH"
          URL=$(gh pr create --title "paper: $TITLE" \
            --body "Covers [arXiv:$ARXIV](https://arxiv.org/abs/$ARXIV).

          ${ISSUE:+Requested in #$ISSUE. }\`bun run build\` passes and the page was loaded in a headless browser: the simulation mounts, mermaid renders, no console errors, no horizontal scroll at 390px.

          Review the claims against the abstract before merging — the generator is told to quote only what the abstract supports, but that is worth a human check." \
            --base main --head "$BRANCH")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Merge automatically
        id: automerge
        if: vars.PAPER_AUTO_MERGE == 'true' && steps.gen.outputs.claims == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Safe to merge unread only because the build, the browser check and
          # the claims audit all passed before the PR existed. Any number the
          # abstract does not support leaves the PR open for a human instead.
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the merge
        if: steps.automerge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A merge made with GITHUB_TOKEN raises no push event, so the Pages
          # deploy would never start by itself and the entry would sit on main,
          # unpublished. A dispatch is allowed; the announcements follow it.
          gh workflow run deploy.yml --ref main
          echo "Started the deploy; the announcements follow it."

      - name: Explain why it was left open
        if: vars.PAPER_AUTO_MERGE == 'true' && steps.gen.outputs.claims != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS: ${{ steps.gen.outputs.claims }}
        run: |
          gh pr comment "${{ steps.pr.outputs.url }}" --body "Not merged automatically.

          These numbers appear in the entry but not in the paper's abstract, which is all the generator was given: \`$CLAIMS\`

          They may be perfectly correct — an entry can legitimately cite related work — but nothing in this pipeline verified them. Check them against the paper, then merge."

      - name: Report back
        if: always() && env.ISSUE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS: ${{ steps.gen.outputs.claims }}
          RUN_LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            if [ "${{ steps.automerge.outputs.merged }}" = "true" ]; then
              MSG="Merged ${{ steps.pr.outputs.url }} — every number in the entry appears in the abstract. The deploy has been started; the Threads and Discord posts follow it."
            elif [ -n "$CLAIMS" ]; then
              MSG="Opened ${{ steps.pr.outputs.url }} — left for review because these numbers are not in the abstract: \`$CLAIMS\`"
            else
              MSG="Opened ${{ steps.pr.outputs.url }}"
            fi
          elif [ "${{ steps.automerge.outputs.merged }}" = "true" ]; then
            # Merged but not live is the state nobody would notice by themselves.
            MSG="Merged ${{ steps.pr.outputs.url }}, but the deploy did not start, so the entry is not live. Run the Deploy to GitHub Pages workflow by hand — [run log]($RUN_LOG)."
          else
            MSG="Build of \`${{ steps.req.outputs.arxiv }}\` failed — [run log]($RUN_LOG)."
          fi
          gh issue comment "$ISSUE" --repo ${{ github.repository }} --body "$MSG"
