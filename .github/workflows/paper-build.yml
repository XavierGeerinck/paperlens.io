name: Paper build

# Publishes one paper as an entry + simulation, on request.
# Triggered by `/build <arxiv-id>` from someone who can write to the repo.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: paper-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      startsWith(github.event.comment.body, '/build') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Parse the request
        id: req
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          ID=$(printf '%s' "$BODY" | grep -oE '[0-9]{4}\.[0-9]{4,5}' | head -1 || true)
          if [ -z "$ID" ]; then
            echo "No arXiv ID found in the comment." >&2
            exit 1
          fi
          echo "arxiv=$ID" >> "$GITHUB_OUTPUT"
          echo "Building $ID"

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Building \`${{ steps.req.outputs.arxiv }}\` — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install chromium
        # Plain install first: it only downloads the browser, while --with-deps
        # runs apt-get update, which fails whenever any third-party repo on the
        # runner image is unhappy (a 403 from packages.microsoft.com broke a run).
        # The ubuntu runner already ships the shared libraries chromium needs.
        run: |
          bunx playwright install chromium || {
            echo "plain install failed; retrying with system dependencies"
            bunx playwright install --with-deps chromium
          }

      - name: Write the entry
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ vars.OPENAI_API_URL }}
          PAPERLENS_MODEL: ${{ vars.PAPERLENS_MODEL }}
        run: |
          set -euo pipefail
          bun scripts/build-entry.ts "${{ steps.req.outputs.arxiv }}" --retries 3 | tee result.json
          echo "slug=$(jq -r .slug result.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title result.json)" >> "$GITHUB_OUTPUT"
          echo "entry=$(jq -r .entryPath result.json)" >> "$GITHUB_OUTPUT"
          echo "sim=$(jq -r .simPath result.json)" >> "$GITHUB_OUTPUT"

      - name: Verify it renders
        run: bun scripts/verify-page.ts "/idea/${{ steps.gen.outputs.slug }}/"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="paper/${{ steps.gen.outputs.slug }}"
          git config user.name "paperlens-bot"
          git config user.email "noreply@paperlens.io"
          git checkout -b "$BRANCH"

          # Only the generated entry, its simulation, and any reverse links.
          git add "${{ steps.gen.outputs.entry }}" "${{ steps.gen.outputs.sim }}"
          git add src/content/ideas
          git commit -m "feat(paper): ${{ steps.gen.outputs.title }}

          Covers arXiv:${{ steps.req.outputs.arxiv }}. Generated by /build from
          issue #${{ github.event.issue.number }}, build verified and rendered
          in a headless browser before this PR was opened."

          git push -u origin "$BRANCH"
          URL=$(gh pr create --title "paper: ${{ steps.gen.outputs.title }}" \
            --body "Covers [arXiv:${{ steps.req.outputs.arxiv }}](https://arxiv.org/abs/${{ steps.req.outputs.arxiv }}).

          Requested in #${{ github.event.issue.number }}. \`bun run build\` passes and the page was loaded in a headless browser: the simulation mounts, mermaid renders, no console errors, no horizontal scroll at 390px.

          Review the claims against the abstract before merging — the generator is told to quote only what the abstract supports, but that is worth a human check." \
            --base main --head "$BRANCH")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="Opened ${{ steps.pr.outputs.url }}"
          else
            MSG="Build of \`${{ steps.req.outputs.arxiv }}\` failed — [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
